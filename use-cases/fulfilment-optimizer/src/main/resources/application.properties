quarkus.timefold.solver.termination.spent-limit=5s
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:fulfilment}
quarkus.datasource.password=${DB_PASSWORD:fulfilment}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/fulfilment}
quarkus.hibernate-orm.schema-management.strategy=update

fulfilment.events.sqs.enabled=${SQS_ENABLED:false}
fulfilment.events.sqs.queue-url=${SQS_QUEUE_URL:}
fulfilment.events.sqs.region=${AWS_REGION:ap-southeast-2}
fulfilment.events.sqs.endpoint-override=${SQS_ENDPOINT:}
fulfilment.events.sqs.access-key=${AWS_ACCESS_KEY_ID:test}
fulfilment.events.sqs.secret-key=${AWS_SECRET_ACCESS_KEY:test}
fulfilment.outbox.interval=1s

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:fulfilment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.scheduler.enabled=false
%test.quarkus.timefold.solver.termination.spent-limit=1s
